[project]
name = "student-ops-desk"
version = "0.1.0"
description = "Saylani Student Operations Desk - AI-powered student support system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.0.1",
    "chainlit>=1.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "T20", "TCH", "ARG", "PTH", "ERA", "PL", "TRY", "SIM"]
ignore = ["ANN101", "ANN102", "ARG001", "ARG002", "TRY003"]
per-file-ignores = { "tests/*" = ["S101", "S106", "T201", "T203", "PL001"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]